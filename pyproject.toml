[build-system]
requires = [
    "setuptools",
]
build-backend = "setuptools.build_meta"

[project]
requires-python = ">=3.10"
name = "clip_zero_shot_xray"
readme = "README.md"
dynamic = [
    "version",
]
dependencies = [
    "ipython>=8.10",
    "jupyterlab>=3.0",
    "notebook",
    "kedro~=1.6.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "plotly>=5.18",
    "transformers>=4.40",
    "open_clip_torch>=2.24",
    "huggingface_hub>=0.23",
    "pillow>=10.0",
    "opencv-python>=4.9",
    "scikit-image>=0.22",
    "albumentations>=1.4",
    "ipywidgets>=8.1",
]

[project.scripts]
clip-zero-shot-xray = "clip_zero_shot_xray.__main__:main"

[project.entry-points."kedro.hooks"]

[project.optional-dependencies]
dev = [
    "pytest-cov>=3,<7",
    "pytest-mock>=1.7.1, <2.0",
    "pytest~=7.2",
    "ruff~=0.12.0",
]
app = [
    "gradio>=5.0",
]

[tool.setuptools.dynamic.version]
attr = "clip_zero_shot_xray.__version__"

[tool.setuptools.packages.find]
where = [
    "src",
]
namespaces = false

[tool.kedro]
package_name = "clip_zero_shot_xray"
project_name = "CLIP Zero-Shot Concept Extraction on Chest X-rays"
kedro_init_version = "1.6.0"
tools = "['Linting', 'Testing', 'Data Structure']"
example_pipeline = "False"
source_dir = "src"

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
addopts = "--cov-report term-missing --cov src/clip_zero_shot_xray -ra"

[tool.coverage.report]
fail_under = 0
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 88
show-fixes = true

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "F",
    "W",
    "E",
    "I",
    "UP",
    "PL",
    "T201",
]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = [
    "T201",
]
